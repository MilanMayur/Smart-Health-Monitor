<!-- web/layouts/private.html -->
{{define "private"}}
<!-- Top Navbar -->
<header class="bg-white shadow">
  <div class="container mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/dashboard" class="flex items-center gap-2">
      <img src="/static/logo.png" class="h-8 w-8" alt="logo"/>
      <span class="font-bold">Smart Health Monitor</span>
    </a>
    <form action="/auth/logout" method="POST">
      <button type="submit" class="px-2 py-1 bg-red-600 text-white rounded shadow-lg hover:bg-red-700">
        Logout
      </button>
    </form>
  </div>
</header>
<div class="flex flex-1">
  <!-- Sidebar -->
  <aside class="w-56 bg-gray-100 p-4 space-y-4">
    <a href="/dashboard" class="block mx-2 p-2 rounded hover:scale-105"><strong>Dashboard</strong></a>
    <a href="/health" class="block mx-2 p-2 hover:scale-105"><strong>Health Predictions</strong></a>
    <a href="/insights" class="block mx-2 p-2 hover:scale-105"><strong>Insights</strong></a>
    <a href="/fitness" class="block mx-2 p-2 hover:scale-105"><strong>Fitness Planner</strong></a>
    <a href="/nutrition" class="block mx-2 p-2 hover:scale-105"><strong>Nutrition Planner</strong></a>
    <a href="/ai/chatbot" class="block mx-2 p-2 hover:scale-105"><strong>Chatbot</strong></a>
    <a href="/user/profile" class="block mx-2 p-2 hover:scale-105"><strong>Profile</strong></a>
  </aside>

  <!-- Page content -->
  <main class="flex-grow container mx-auto px-4 py-6">
    <div class="fixed top-0 left-0 w-screen h-screen -z-20 bg-cover bg-center bg-no-repeat 
                bg-fixed opacity-40"
     style="background-image: url('/static/background1.png');"></div>
    {{block "content" .}}{{end}}
  </main>
</div>
{{end}}
