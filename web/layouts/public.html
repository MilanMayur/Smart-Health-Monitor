<!-- web/components/public.html -->
{{define "public"}}
<header class="bg-white shadow">
  <div class="container mx-auto px-4 py-3 flex items-center justify-between">
    <a href="/" class="flex items-center gap-2">
      <img src="/static/logo.png" class="h-8 w-8" alt="logo"/>
      <span class="font-bold">Smart Health Monitor</span>
    </a>
    <nav class="flex items-center gap-4">
      <a href="/login" class="text-sm font-bold text-gray-700 hover:text-black">Login</a>
      <a href="/register" class="text-sm font-bold text-gray-700 hover:text-black">Register</a>
    </nav>
  </div>
</header>
<main class="flex-grow container mx-auto px-4 py-6">
  {{block "content" .}}{{end}}
</main>
{{end}}
