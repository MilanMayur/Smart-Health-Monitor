<!-- web/pages/profile.html -->
{{define "content"}}
<h1 class="text-3xl font-bold mb-4 text-center">Profile</h1>
<div class="max-w-xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-200">
  
  <!-- Header -->
  <div class="bg-gradient-to-r from-green-500 to-green-400 p-6 flex items-center justify-between">
    <div class="flex items-center space-x-4">
      <img src="/static/user_icon.png" alt="Avatar" 
         class="h-20 w-20 rounded-full border-4 border-white shadow-md">
      <div>
        <h2 class="text-2xl font-bold text-white">{{.User.FirstName}} {{.User.LastName}}</h2>
        <p class="text-green-100">{{.User.Email}}</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-semibold
           bg-{{.User.Badge.Color}}-400 text-white shadow">
        {{.User.Badge.Emoji}} {{.User.Badge.Label}} Health Badge
      </span>
    </div>
  </div>

  <!-- Details -->
  <div class="p-6 space-y-6">
    <div class="text-center">
      <label class="block text-gray-500 text-sm font-medium">Full Name</label>
      <p class="text-gray-900 text-lg font-semibold">{{.User.FirstName}} {{.User.LastName}}</p>
    </div>
    <div class="text-center">
      <label class="block text-gray-500 text-sm font-medium">Email</label>
      <p class="text-gray-900 text-lg font-semibold">{{.User.Email}}</p>
    </div>
    <div class="text-center">
      <label class="block text-gray-500 text-sm font-medium">Member Since</label>
      <p class="text-gray-900 text-lg font-semibold">{{.User.CreatedAt}}</p>
    </div>
  </div>

  <!-- Actions -->
  <div class="bg-gray-50 px-6 py-4 flex flex-wrap justify-center gap-3">
    <a href="/user/update-profile" 
       class="w-40 px-3 py-2 bg-blue-600 text-white rounded-lg font-medium 
              hover:bg-blue-700 transition text-center">
      Update Profile
    </a>
    <a href="/user/update-metrics" 
       class="w-40 px-3 py-2 bg-yellow-600 text-white rounded-lg font-medium 
              hover:bg-yellow-700 transition text-center">
      Update Metrics
    </a>
    <a href="/user/change-password" 
       class="w-40 px-3 py-2 bg-blue-600 text-white rounded-lg font-medium 
              hover:bg-blue-700 transition text-center">
      Change Password
    </a>
  </div>
</div>
{{end}}
