<!-- web/pages/login.html -->
{{define "content"}}
<div id="bg2" class="fixed top-0 left-0 w-screen h-screen -z-10 bg-cover bg-center bg-no-repeat 
                    bg-fixed"
     style="background-image: url('/static/background1.png');"></div>
<div class="max-w-md mx-auto text-center bg-white p-10 mt-20 rounded-xl shadow">
    <h2 class="text-xl font-semibold mb-4">Login</h2>
    <form id="loginForm" class="space-y-4">
        <input name="email" type="email" placeholder="Email" class="w-full border p-2 rounded"/>
        <input name="password" type="password" placeholder="Password" class="w-full border p-2 rounded"/>
        <button class="w-full bg-black text-white py-2 rounded">Login</button>
    </form>
    {{if .Error}}
    <p class="m-3 text-red-600 text-sm">{{.Error}}</p>
    {{end}}
    <p class="text-sm mt-3">No account? <a href="/register" class="underline">Register</a></p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
            email: e.target.email.value,
            password: e.target.password.value
        };
        const res = await fetch('/auth/login', {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify(body),
                        credentials: 'include'
                    });
        if (res.ok) {
            window.location.href = '/dashboard';
        } else {
            const txt = await res.text();
            window.location.href = '/login?error=' + encodeURIComponent(txt || 'Login failed');
        }
    });
</script>
{{end}}
