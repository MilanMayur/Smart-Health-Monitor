<!-- web/pages/update_profile.html -->
{{define "content"}}
<div class="max-w-md mx-auto bg-white shadow-md rounded-lg p-6">
  <h2 class="text-2xl text-center font-bold mb-4">Update Profile</h2>

  <form action="/user/update" method="POST" class="space-y-4">
    <div>
      <label class="block text-gray-600 font-medium">First Name</label>
      <input type="text" name="firstName" value="{{.User.FirstName}}" 
             class="w-full border rounded px-3 py-2" required />
    </div>
    <div>
      <label class="block text-gray-600 font-medium">Last Name</label>
      <input type="text" name="lastName" value="{{.User.LastName}}" 
             class="w-full border rounded px-3 py-2" required />
    </div>
    <div>
      <label class="block text-gray-600 font-medium">Email</label>
      <input type="email" name="email" value="{{.User.Email}}" 
             class="w-full border rounded px-3 py-2" required />
    </div>

    <div class="flex justify-between items-center">
      <a href="/user/profile" class="text-sm text-gray-500 hover:underline">
         ← Back to Profile
      </a>
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
        Save Changes
      </button>
    </div>
  </form>
</div>
{{end}}
