<!-- web/pages/change-password.html -->
{{define "content"}}
<div class="max-w-md mx-auto bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-200">
  
  <!-- Header -->
  <div class="bg-white p-6 text-center">
    <h2 class="text-2xl font-bold text-gray-800">Change Password</h2>
    <p class="text-gray-600 text-sm">Update your account security</p>
  </div>

  <!-- Form -->
  <form action="/user/change-password" method="POST" class="p-6 space-y-5">
    
    <!-- Current Password -->
    <div>
      <label class="block text-gray-600 font-medium mb-1">Current Password</label>
      <input type="password" name="current_password" required
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 focus:outline-none">
    </div>

    <!-- New Password -->
    <div>
      <label class="block text-gray-600 font-medium mb-1">New Password</label>
      <input type="password" name="new_password" required
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 focus:outline-none">
    </div>

    <!-- Confirm Password -->
    <div>
      <label class="block text-gray-600 font-medium mb-1">Confirm New Password</label>
      <input type="password" name="confirm_password" required
             class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-yellow-400 focus:outline-none">
    </div>

    <!-- Actions -->
    <div class="flex justify-between items-center">
      <a href="/user/profile" class="text-sm text-gray-500 hover:underline">
        ← Back to Profile
    </a>
      <button type="submit" 
              class="px-5 py-2 bg-yellow-600 text-white rounded-lg font-medium hover:bg-yellow-700 transition">
        Update Password
      </button>
    </div>
  </form>

  <!-- Success Message -->
  {{if .Success}}
  <div class="bg-green-100 border border-green-300 text-green-800 px-4 py-3 m-6 rounded-lg text-center">
    {{.Success}} <br>
    <span class="text-sm text-gray-600">Redirecting to profile in 3 sec...</span>
  </div>
  <script>
    setTimeout(() => {
      window.location.href = "/user/profile";
    }, 3000);
  </script>
  {{end}}

  <!-- Error Message -->
  {{if .Error}}
  <div class="bg-red-100 border border-red-300 text-red-800 px-4 py-3 m-6 rounded-lg text-center">
    {{.Error}}
  </div>
  {{end}}
</div>
{{end}}
